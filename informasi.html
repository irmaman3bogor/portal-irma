<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informasi & Pengumuman - Portal IRMA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }

    /* HEADER POLOS */
    .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
    .btn-kembali { background: #6c757d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; border: none; cursor: pointer; }
    .btn-kembali:hover { background: #5a6268; }
    .page-header h2 { color: #0a3622; font-size: 22px; }

    /* KARTU BERITA */
    .news-grid { display: grid; gap: 20px; }
    .news-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid #d4af37; display: flex; flex-direction: column; }
    .news-header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
    .news-title { margin: 0; color: #0a3622; font-size: 18px; font-weight: 700; line-height: 1.4; }
    .news-date { font-size: 11px; color: #666; background: #f0f0f0; padding: 5px 10px; border-radius: 6px; white-space: nowrap; font-weight: 600; }
    .news-content { padding: 0 20px 20px; color: #444; font-size: 14px; line-height: 1.7; white-space: pre-line; }
    .news-footer { padding: 12px 20px; background: #fafafa; border-top: 1px solid #eee; font-size: 12px; color: #777; display: flex; align-items: center; gap: 5px; }
    .news-footer strong { color: #0a3622; }

    /* TAMPILAN JIKA KOSONG / LOADING */
    .empty-state { background: white; padding: 40px 20px; text-align: center; border-radius: 12px; color: #777; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .loading-state { text-align: center; padding: 30px; color: #777; font-style: italic; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fungsi Tombol Kembali
    window.tutupInformasi = function() {
      // Cek apakah halaman ini berjalan di dalam iframe
      if (window.parent && window.parent !== window) {
        // Jika iya, kirim pesan ke parent (beranda-siswa.html) untuk menutup iframe
        window.parent.postMessage('tutup-iframe', '*');
      } else {
        // Jika dibuka langsung, lempar ke beranda-siswa.html
        window.location.href = 'beranda-siswa.html';
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("daftarBeritaSiswa");
      
      try {
        const q = query(collection(db, "informasi_irma"), orderBy("waktu", "desc"));
        const snap = await getDocs(q);
        
        if (snap.empty) {
          container.innerHTML = `<div class="empty-state">Belum ada pengumuman atau berita yang diposting.</div>`;
          return;
        }

        let html = "";
        snap.forEach((d) => {
          const item = d.data();
          html += `
            <div class="news-card">
              <div class="news-header">
                <h3 class="news-title">${item.judul}</h3>
                <span class="news-date">📅 ${item.tanggal}</span>
              </div>
              <div class="news-content">${item.isi}</div>
              <div class="news-footer">
                <span>👤 Diposting oleh: <strong>${item.penulis}</strong></span>
              </div>
            </div>`;
        });
        container.innerHTML = html;

      } catch (err) {
        console.error("Error Firebase:", err);
        container.innerHTML = `<div class="empty-state" style="color:#e74c3c;">Gagal memuat data informasi.</div>`;
      }
    });
  </script>
</head>
<body>

  <!-- HEADER POLOS DENGAN TOMBOL KEMBALI -->
  <div class="page-header">
    <button onclick="tutupInformasi()" class="btn-kembali">← Kembali</button>
    <h2>📢 Informasi & Pengumuman</h2>
  </div>

  <!-- DAFTAR BERITA -->
  <div id="daftarBeritaSiswa" class="news-grid">
    <div class="loading-state">Memuat informasi terbaru...</div>
  </div>

</body>
</html>
