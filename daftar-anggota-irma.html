    function renderTable() {
      const tbody = document.getElementById("tabelAnggotaBody");
      let html = "";
      
      dataAnggota.forEach((d, index) => {
        // Tentukan warna badge kelas
        const isXI = d.kelas.toUpperCase().includes("XI");
        const badgeClass = isXI ? "badge-xi" : "badge-x";
        
        html += `
          <tr>
            <td style="text-align:center;">${index + 1}</td>
            <td><b>${d.nama}</b></td>
            <td>${d.nisn}</td>
            <td>${d.nis}</td>
            <td style="text-align:center;"><span class="badge ${badgeClass}">${d.kelas}</span></td>
            <td>${d.alamat}</td>
            <td>${d.noHp}</td>
            <td>${d.ortu}</td>
            <td>${d.hpOrtu}</td>
            <td style="font-style:italic; color:#555;">"${d.moto}"</td>
          </tr>
        `;
      });
      
      tbody.innerHTML = html;
    }

    window.onload = renderTable;
