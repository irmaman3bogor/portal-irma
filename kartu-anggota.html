<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kartu Anggota IRMA - Portal IRMA</title>
  <!-- Library untuk Barcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
    body { 
      font-family: 'Poppins', sans-serif; 
      background: #f4f7f6; 
      margin: 0; 
      padding: 40px 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
    }

    /* DESAIN KARTU */
    .kartu { 
      width: 320px; 
      height: 500px;
      background: #ffffff;
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
      position: relative;
      overflow: hidden;
      color: #333;
      border: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    /* GELOMBANG BIRU TOSKA (KIRI ATAS) */
    .wave-top-left {
      position: absolute;
      top: -50px;
      left: -50px;
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      z-index: 1;
    }

    /* GELOMBANG ORANYE (KANAN BAWAH) */
    .wave-bottom-right {
      position: absolute;
      bottom: -50px;
      right: -50px;
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, #f4a261, #e76f51);
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      z-index: 1;
    }

    /* KONTEN KARTU */
    .konten { position: relative; z-index: 2; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100%; }

    /* HEADER LOGO */
    .header { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 15px; }
    .header img { width: 40px; height: 40px; background: white; border-radius: 50%; padding: 3px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .header div h2 { margin: 0; font-size: 14px; color: #00b4d8; font-weight: 800; letter-spacing: 1px; }
    .header div p { margin: 0; font-size: 10px; color: #f4a261; font-weight: 600; }

    /* FOTO PROFIL BULAT */
    .foto-container {
      width: 120px; height: 120px; border-radius: 50%; 
      border: 4px solid #00b4d8; padding: 3px; background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px;
      display: flex; justify-content: center; align-items: center;
    }
    .foto-profil { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #eee; }

    /* NAMA DAN JABATAN */
    .nama { font-size: 18px; font-weight: 800; color: #0077b6; text-align: center; margin: 0; text-transform: uppercase; line-height: 1.2; }
    .jabatan { font-size: 12px; color: #f4a261; font-weight: 600; text-align: center; margin: 2px 0 20px 0; }

    /* DATA DETAIL */
    .detail { width: 100%; font-size: 11px; color: #555; padding: 0 10px; margin-bottom: auto; }
    .detail table { width: 100%; border-collapse: collapse; }
    .detail td { padding: 4px 0; vertical-align: top; }
    .detail td:first-child { font-weight: 700; color: #00b4d8; width: 80px; }

    /* BARCODE */
    .barcode-container { width: 100%; text-align: center; padding-bottom: 10px; margin-top: 10px; }
    #barcode { width: 90%; height: 40px; }

    /* TOMBOL PRINT */
    .btn-print { 
      display: block; 
      width: 100%; 
      max-width: 320px; 
      margin: 20px auto 0; 
      padding: 12px; 
      background: #0077b6; 
      color: white; 
      text-align: center; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 16px;
    }
    .btn-print:hover { background: #005f8a; }

    @media print {
      body { background: white; padding: 0; }
      .btn-print { display: none; }
      .kartu { box-shadow: none; border: none; }
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fb = { doc, getDoc };
  </script>
</head>
<body>

  <div style="width: 100%;">
    <!-- KARTU ANGGOTA -->
    <div class="kartu" id="kartuAnggota">
      <!-- Gelombang Dekoratif -->
      <div class="wave-top-left"></div>
      <div class="wave-bottom-right"></div>

      <div class="konten">
        <!-- Header Logo -->
        <div class="header">
          <img src="logo.png" alt="Logo IRMA">
          <div>
            <h2>PORTAL IRMA</h2>
            <p>MAN 3 BOGOR</p>
          </div>
        </div>

        <!-- Foto Profil -->
        <div class="foto-container">
          <img id="fotoProfil" src="https://ui-avatars.com/api/?name=Siswa&background=eee&color=aaa" class="foto-profil" alt="Foto">
        </div>

        <!-- Nama & Jabatan -->
        <h1 class="nama" id="txtNama">MEMUAT...</h1>
        <p class="jabatan" id="txtJabatan">-</p>

        <!-- Detail Data -->
        <div class="detail">
          <table>
            <tr><td>ID</td><td>: <span id="txtNoId">-</span></td></tr>
            <tr><td>NIS</td><td>: <span id="txtNis">-</span></td></tr>
            <tr><td>Tgl Lahir</td><td>: <span id="txtTglLahir">-</span></td></tr>
            <tr><td>No HP</td><td>: <span id="txtNoHp">-</span></td></tr>
          </table>
        </div>

        <!-- Barcode -->
        <div class="barcode-container">
          <svg id="barcode"></svg>
        </div>
      </div>
    </div>

    <!-- Tombol Cetak -->
    <button class="btn-print" onclick="window.print()">🖨️ CETAK KARTU</button>
  </div>

  <script>
    // Ambil UID dari URL atau localStorage
    const urlParams = new URLSearchParams(window.location.search);
    let uid = urlParams.get('uid');
    if (!uid) {
      const userLogin = JSON.parse(localStorage.getItem("userLoginData"));
      if (userLogin && userLogin.uid) uid = userLogin.uid;
    }

    if (!uid) {
      alert("Sesi login tidak ditemukan. Silakan login ulang.");
    } else {
      muatDataKartu(uid);
    }

    async function muatDataKartu(uid) {
      try {
        const { doc, getDoc } = window.fb;
        const docRef = doc(window.db, "AnggotaIRMA", uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          document.getElementById("txtNama").innerText = data.nama || "NAMA LENGKAP";
          document.getElementById("txtJabatan").innerText = data.jabatan || "Jabatan";
          document.getElementById("txtNoId").innerText = data.noId || "-";
          document.getElementById("txtNis").innerText = data.nis || "-";
          document.getElementById("txtTglLahir").innerText = data.tanggalLahir || "-";
          document.getElementById("txtNoHp").innerText = data.noHp || "-";

          if (data.fotoUrl) {
            document.getElementById("fotoProfil").src = data.fotoUrl;
          } else {
            const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.nama || 'Siswa')}&background=00b4d8&color=fff&size=150`;
            document.getElementById("fotoProfil").src = avatarUrl;
          }

          // Generate Barcode
          const barcodeData = data.nis || data.noId || "000000";
          JsBarcode("#barcode", barcodeData, {
            format: "CODE128",
            lineColor: "#333",
            width: 1.5,
            height: 35,
            displayValue: false
          });

        } else {
          // Fallback ke biodata_siswa
          const docRefLama = doc(window.db, "biodata_siswa", uid);
          const docSnapLama = await getDoc(docRefLama);
          if (docSnapLama.exists()) {
            const data = docSnapLama.data();
            document.getElementById("txtNama").innerText = data.nama || "NAMA LENGKAP";
            document.getElementById("txtNis").innerText = data.nis || "-";
            document.getElementById("txtTglLahir").innerText = data.tanggalLahir || "-";
            document.getElementById("txtNoHp").innerText = data.noHp || "-";
            
            if (data.fotoUrl) {
              document.getElementById("fotoProfil").src = data.fotoUrl;
            } else {
              const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.nama || 'Siswa')}&background=00b4d8&color=fff&size=150`;
              document.getElementById("fotoProfil").src = avatarUrl;
            }

            JsBarcode("#barcode", data.nis || "000000", { format: "CODE128", lineColor: "#333", width: 1.5, height: 35, displayValue: false });
          } else {
            alert("Data anggota belum diisi. Silakan isi Entri Biodata terlebih dahulu.");
          }
        }
      } catch (error) {
        console.error(error);
        alert("Gagal memuat data kartu.");
      }
    }
  </script>
</body>
</html>
