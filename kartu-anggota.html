<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kartu Anggota IRMA - IKATAN REMAJA MASJID</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
    
    body { 
      font-family: 'Montserrat', sans-serif; 
      background: #e0e0e0; 
      margin: 0; 
      padding: 40px 20px; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
    }

    /* DESAIN KARTU */
    .kartu { 
      width: 320px; 
      height: 500px; 
      background: #ffffff; 
      border-radius: 16px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
    }

    /* GELOMBANG HIJAU TOSKA (KIRI ATAS) */
    .wave-blue {
      position: absolute;
      top: -80px;
      left: -100px;
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #2a9d8f, #264653);
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      z-index: 1;
      transform: rotate(-15deg);
    }

    /* GELOMBANG ORANYE (KANAN BAWAH) */
    .wave-orange {
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #f4a261, #e76f51);
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      z-index: 1;
      transform: rotate(20deg);
    }

    /* KONTEN KARTU */
    .konten { 
      position: relative; 
      z-index: 2; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      height: 100%; 
    }

    /* HEADER LOGO */
    .header { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      width: 100%; 
      margin-bottom: 20px; 
      margin-top: 10px;
    }
    .header img { 
      width: 35px; 
      height: 35px; 
      background: white; 
      border-radius: 8px; 
      padding: 3px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    }
    .header div h2 { 
      margin: 0; 
      font-size: 13px; 
      color: #000000; /* Warna hitam sesuai permintaan */
      font-weight: 800; 
      letter-spacing: 0.5px; 
      line-height: 1.1;
    }
    .header div p { 
      margin: 0; 
      font-size: 10px; 
      color: #e76f51; 
      font-weight: 600; 
    }

    /* FOTO PROFIL BULAT */
    .foto-container { 
      width: 130px; 
      height: 130px; 
      border-radius: 50%; 
      border: 3px solid #2a9d8f; 
      padding: 4px; 
      background: white; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
      margin-bottom: 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      position: relative;
    }
    .foto-profil { 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      object-fit: cover; 
      background: #eee; 
    }

    /* NAMA DAN JABATAN */
    .nama { 
      font-size: 20px; 
      font-weight: 800; 
      color: #2a9d8f; 
      text-align: center; 
      margin: 0; 
      text-transform: uppercase; 
      line-height: 1.2; 
      letter-spacing: 0.5px;
    }
    .jabatan { 
      font-size: 13px; 
      color: #e76f51; 
      font-weight: 600; 
      text-align: center; 
      margin: 4px 0 25px 0; 
    }

    /* DATA DETAIL */
    .detail { 
      width: 100%; 
      font-size: 11px; 
      color: #555; 
      padding: 0 10px; 
      margin-bottom: auto; 
    }
    .detail table { 
      width: 100%; 
      border-collapse: collapse; 
    }
    .detail td { 
      padding: 5px 0; 
      vertical-align: middle; 
    }
    .detail td:first-child { 
      font-weight: 700; 
      color: #2a9d8f; 
      width: 60px; 
    }
    .detail i {
      margin-right: 5px;
      color: #e76f51;
    }

    /* BARCODE */
    .barcode-container { 
      width: 100%; 
      text-align: center; 
      padding-bottom: 15px; 
      margin-top: 10px; 
    }
    #barcode { 
      width: 85%; 
      height: 35px; 
    }

    /* TOMBOL PRINT */
    .btn-print { 
      display: block; 
      width: 100%; 
      max-width: 320px; 
      margin: 25px auto 0; 
      padding: 15px; 
      background: #2a9d8f; 
      color: white; 
      text-align: center; 
      border: none; 
      border-radius: 10px; 
      font-weight: 700; 
      cursor: pointer; 
      font-size: 16px; 
      box-shadow: 0 4px 15px rgba(42, 157, 143, 0.4);
    }
    .btn-print:hover { background: #21867a; }

    @media print {
      body { background: white; padding: 0; }
      .btn-print { display: none; }
      .kartu { box-shadow: none; border: 2px solid #000; }
    }
  </style>

  <!-- Inisialisasi Firebase secara Modular Global -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.doc = doc;
    window.getDoc = getDoc;

    initApp();
  </script>
</head>
<body>

  <!-- KARTU ANGGOTA -->
  <div class="kartu" id="kartuAnggota">
    <div class="wave-blue"></div>
    <div class="wave-orange"></div>

    <div class="konten">
      <div class="header">
        <img src="logo.png" alt="Logo IRMA">
        <div>
          <h2>IKATAN REMAJA MASJID</h2>
          <p>MAN 3 BOGOR</p>
        </div>
      </div>

      <div class="foto-container">
        <img id="fotoProfil" src="https://ui-avatars.com/api/?name=Siswa&background=eee&color=aaa" class="foto-profil" alt="Foto">
      </div>

      <h1 class="nama" id="txtNama">MEMUAT...</h1>
      <p class="jabatan" id="txtJabatan">-</p>

      <div class="detail">
        <table>
          <tr><td><i>🆔</i> ID</td><td>: <span id="txtNoId">-</span></td></tr>
          <tr><td><i>🎂</i> Tgl Lahir</td><td>: <span id="txtTglLahir">-</span></td></tr>
          <tr><td><i>📞</i> No HP</td><td>: <span id="txtNoHp">-</span></td></tr>
        </table>
      </div>

      <div class="barcode-container">
        <svg id="barcode"></svg>
      </div>
    </div>
  </div>

  <!-- Tombol Cetak -->
  <button class="btn-print" onclick="window.print()">🖨️ CETAK KARTU</button>

  <script>
    function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      let uid = urlParams.get('uid');
      if (!uid) {
        const userLogin = JSON.parse(localStorage.getItem("userLoginData"));
        if (userLogin && userLogin.uid) uid = userLogin.uid;
      }

      if (!uid) {
        alert("Sesi login tidak ditemukan. Silakan login ulang.");
      } else {
        muatDataKartu(uid);
      }
    }

    async function muatDataKartu(uid) {
      try {
        const docRef = window.doc(window.db, "AnggotaIRMA", uid);
        const docSnap = await window.getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById("txtNama").innerText = data.nama || "NAMA LENGKAP";
          document.getElementById("txtJabatan").innerText = data.jabatan || "Jabatan";
          document.getElementById("txtNoId").innerText = data.noId || "-";
          document.getElementById("txtTglLahir").innerText = data.tanggalLahir || "-";
          document.getElementById("txtNoHp").innerText = data.noHp || "-";

          if (data.fotoUrl) {
            document.getElementById("fotoProfil").src = data.fotoUrl;
          } else {
            document.getElementById("fotoProfil").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.nama || 'Siswa')}&background=2a9d8f&color=fff&size=150`;
          }

          const barcodeData = data.noId || data.nis || "000000";
          JsBarcode("#barcode", barcodeData, { format: "CODE128", lineColor: "#000", width: 1.5, height: 35, displayValue: false });

        } else {
          const docRefLama = window.doc(window.db, "biodata_siswa", uid);
          const docSnapLama = await window.getDoc(docRefLama);
          
          if (docSnapLama.exists()) {
            const data = docSnapLama.data();
            document.getElementById("txtNama").innerText = data.nama || "NAMA LENGKAP";
            document.getElementById("txtJabatan").innerText = data.jabatan || "Anggota IRMA";
            document.getElementById("txtNoId").innerText = data.nis || "-";
            document.getElementById("txtTglLahir").innerText = data.tanggalLahir || "-";
            document.getElementById("txtNoHp").innerText = data.noHp || "-";
            
            if (data.fotoUrl) {
              document.getElementById("fotoProfil").src = data.fotoUrl;
            } else {
              document.getElementById("fotoProfil").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.nama || 'Siswa')}&background=2a9d8f&color=fff&size=150`;
            }
            
            const barcodeData = data.nis || "000000";
            JsBarcode("#barcode", barcodeData, { format: "CODE128", lineColor: "#000", width: 1.5, height: 35, displayValue: false });
          } else {
            alert("Data anggota belum diisi. Silakan isi Entri Biodata terlebih dahulu.");
          }
        }
      } catch (error) {
        console.error(error);
        alert("Gagal memuat data kartu: " + error.message);
      }
    }
  </script>
</body>
</html>
