<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kas Saya - Portal IRMA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }

    /* HEADER */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
    .page-header h2 { color: #0a3622; font-size: 22px; }
    
    /* KARTU RINGKASAN */
    .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #d4af37; }
    .card h4 { font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 600; }
    .card .value { font-size: 20px; font-weight: 700; color: #0a3622; }

    /* TABEL KAS */
    .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; color: #0a3622; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    td { color: #444; }
    
    /* STATUS BADGE */
    .status { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
    .status.lunas { background: #d4edda; color: #155724; }
    .status.belum { background: #f8d7da; color: #721c24; }

    /* LOADING & ERROR */
    .loading { text-align: center; padding: 40px; color: #777; font-style: italic; }
    .error-box { background: #ffebee; color: #c62828; padding: 20px; border-radius: 8px; text-align: center; }
    .debug-box { margin-top: 20px; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px; font-size: 12px; color: #856404; display: none; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const bulanList = ["juli", "agustus", "september", "oktober", "november", "desember", "januari", "februari", "maret", "april", "mei", "juni"];

    window.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("tabelKas");
      const debugBox = document.getElementById("debugInfo");
      
      // Ambil data login
      const userLoginStr = localStorage.getItem("userLoginData");
      const uidSiswa = localStorage.getItem("irmaUserId");

      if (!userLoginStr && !uidSiswa) {
        container.innerHTML = `<div class="error-box">Sesi login tidak ditemukan. Silakan login ulang.</div>`;
        return;
      }

      let userLogin = userLoginStr ? JSON.parse(userLoginStr) : {};
      let nisLogin = userLogin.nis || ""; // NIS yang dipakai login

      try {
        let dataSiswa = null;
        let siswaId = null;

        // STRATEGI 1: Cari berdasarkan UID (Jika data disimpan pakai UID Auth)
        if (uidSiswa) {
          const docRef = doc(db, "biodata_siswa", uidSiswa);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            dataSiswa = docSnap.data();
            siswaId = uidSiswa;
          }
        }

        // STRATEGI 2: Jika gagal, ambil SEMUA siswa dan cocokkan manual NIS/namanya
        if (!dataSiswa) {
          const snapAll = await getDocs(collection(db, "biodata_siswa"));
          
          snapAll.forEach(d => {
            if (dataSiswa) return; // Jika sudah ketemu, stop loop
            
            const data = d.data();
            // Ambil NISN dari database (bisa field 'nisn' atau 'nis')
            let nisnDB = String(data.nisn || data.nis || "").trim();
            let nisLoginStr = String(nisLogin).trim();

            // Cocokkan persis, atau cocokkan jika salah satu mengandung yang lain
            if (nisnDB !== "" && (nisnDB === nisLoginStr || nisnDB.includes(nisLoginStr) || nisLoginStr.includes(nisnDB))) {
              dataSiswa = data;
              siswaId = d.id;
            }
          });
        }

        // Tampilkan info debug jika masih gagal
        if (!dataSiswa) {
          debugBox.style.display = "block";
          debugBox.innerHTML = `
            <strong>⚠️ Info Debug (Buka untuk Bendahara):</strong><br>
            Sistem tidak menemukan siswa dengan NIS Login: <b>"${nisLogin}"</b>.<br>
            Pastikan NIS ini sama dengan yang diinput di menu <b>Kas Kelas</b> oleh Bendahara.
          `;
          container.innerHTML = `<div class="error-box">Data siswa tidak ditemukan di database. Pastikan NISN/NIS Anda sudah didaftarkan oleh Bendahara di menu Kas Kelas.</div>`;
          return;
        }

        const namaSiswa = dataSiswa.nama || "Siswa";

        // AMBIL DATA IURAN
        const iuranRef = doc(db, "iuran_bulanan", siswaId);
        const iuranSnap = await getDoc(iuranRef);
        
        let dataKas = {};
        if (iuranSnap.exists()) {
          const iuranData = iuranSnap.data();
          dataKas = iuranData.bulan || {};
        }

        // Hitung total lunas
        let totalLunas = 0;
        bulanList.forEach(bulan => {
          if (dataKas[bulan] === true) totalLunas++;
        });

        // Render Ringkasan
        document.getElementById("namaSiswa").innerText = namaSiswa;
        document.getElementById("totalLunas").innerText = totalLunas + " Bulan";
        document.getElementById("totalTunggakan").innerText = (bulanList.length - totalLunas) + " Bulan";

        // Render Tabel
        let html = `
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Bulan</th>
                <th>Status Pembayaran</th>
              </tr>
            </thead>
            <tbody>
        `;

        bulanList.forEach((bulan, index) => {
          const sudahBayar = dataKas[bulan] === true;
          const statusClass = sudahBayar ? 'lunas' : 'belum';
          const statusText = sudahBayar ? 'Lunas' : 'Belum Bayar';
          
          const namaBulan = bulan.charAt(0).toUpperCase() + bulan.slice(1);

          html += `
            <tr>
              <td>${index + 1}</td>
              <td style="font-weight: 600;">${namaBulan}</td>
              <td><span class="status ${statusClass}">${statusText}</span></td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (err) {
        console.error("Error Firebase:", err);
        container.innerHTML = `<div class="error-box">Terjadi kesalahan sistem: ${err.message}</div>`;
      }
    });
  </script>
</head>
<body>

  <div class="page-header">
    <h2>💰 Kas Saya</h2>
  </div>

  <div class="summary-cards">
    <div class="card">
      <h4>Nama Siswa</h4>
      <div class="value" id="namaSiswa" style="font-size: 16px;">Memuat...</div>
    </div>
    <div class="card">
      <h4>Total Lunas</h4>
      <div class="value" id="totalLunas" style="color: #2a9d8f;">-</div>
    </div>
    <div class="card">
      <h4>Total Tunggakan</h4>
      <div class="value" id="totalTunggakan" style="color: #e74c3c;">-</div>
    </div>
  </div>

  <div class="table-container" id="tabelKas">
    <div class="loading">Memuat data kas Anda...</div>
  </div>

  <!-- KOTAK DEBUG UNTUK BANTUAN -->
  <div id="debugInfo" class="debug-box"></div>

</body>
</html>
