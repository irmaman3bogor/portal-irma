<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kas Saya - Portal IRMA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }

    /* HEADER */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
    .page-header h2 { color: #0a3622; font-size: 22px; }
    
    /* KARTU RINGKASAN */
    .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #d4af37; }
    .card h4 { font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 600; }
    .card .value { font-size: 20px; font-weight: 700; color: #0a3622; }

    /* TABEL KAS */
    .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; color: #0a3622; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    td { color: #444; }
    
    /* STATUS BADGE */
    .status { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
    .status.lunas { background: #d4edda; color: #155724; }
    .status.belum { background: #f8d7da; color: #721c24; }

    /* LOADING & ERROR */
    .loading { text-align: center; padding: 40px; color: #777; font-style: italic; }
    .error-box { background: #ffebee; color: #c62828; padding: 20px; border-radius: 8px; text-align: center; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Daftar Bulan untuk ditampilkan
    const bulanList = ["Juli", "Agustus", "September", "Oktober", "November", "Desember", "Januari", "Februari", "Maret", "April", "Mei"];

    window.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("tabelKas");
      
      // Ambil UID Siswa dari localStorage (dikirim oleh beranda-siswa.html)
      const uidSiswa = localStorage.getItem("irmaUserId");

      if (!uidSiswa) {
        container.innerHTML = `<div class="error-box">Sesi login tidak ditemukan. Silakan login ulang.</div>`;
        return;
      }

      try {
        // PENTING: Asumsi nama collection di database Anda adalah "data_siswa"
        // dan nama dokumennya adalah UID Siswa.
        const docRef = doc(db, "data_siswa", uidSiswa);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          container.innerHTML = `<div class="error-box">Data siswa tidak ditemukan di database. Pastikan Anda sudah mengisi Entri Biodata.</div>`;
          return;
        }

        const dataSiswa = docSnap.data();
        const namaSiswa = dataSiswa.nama_lengkap || dataSiswa.nama || "Siswa";
        
        // Asumsi: Data kas disimpan di dalam field bernama "kas" (object)
        // Contoh format di Firebase: kas: { "Juli": true, "Agustus": false, ... }
        const dataKas = dataSiswa.kas || {};

        // Hitung total lunas
        let totalLunas = 0;
        bulanList.forEach(bulan => {
          if (dataKas[bulan] === true) totalLunas++;
        });

        // Render Ringkasan
        document.getElementById("namaSiswa").innerText = namaSiswa;
        document.getElementById("totalLunas").innerText = totalLunas + " Bulan";
        document.getElementById("totalTunggakan").innerText = (bulanList.length - totalLunas) + " Bulan";

        // Render Tabel
        let html = `
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Bulan</th>
                <th>Status Pembayaran</th>
              </tr>
            </thead>
            <tbody>
        `;

        bulanList.forEach((bulan, index) => {
          const sudahBayar = dataKas[bulan] === true;
          const statusClass = sudahBayar ? 'lunas' : 'belum';
          const statusText = sudahBayar ? 'Lunas' : 'Belum Bayar';

          html += `
            <tr>
              <td>${index + 1}</td>
              <td style="font-weight: 600;">${bulan}</td>
              <td><span class="status ${statusClass}">${statusText}</span></td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (err) {
        console.error("Error Firebase:", err);
        container.innerHTML = `<div class="error-box">Terjadi kesalahan sistem: ${err.message}</div>`;
      }
    });
  </script>
</head>
<body>

  <div class="page-header">
    <h2>💰 Kas Saya</h2>
  </div>

  <div class="summary-cards">
    <div class="card">
      <h4>Nama Siswa</h4>
      <div class="value" id="namaSiswa" style="font-size: 16px;">Memuat...</div>
    </div>
    <div class="card">
      <h4>Total Lunas</h4>
      <div class="value" id="totalLunas" style="color: #2a9d8f;">-</div>
    </div>
    <div class="card">
      <h4>Total Tunggakan</h4>
      <div class="value" id="totalTunggakan" style="color: #e74c3c;">-</div>
    </div>
  </div>

  <div class="table-container" id="tabelKas">
    <div class="loading">Memuat data kas Anda...</div>
  </div>

</body>
</html>
