<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Informasi - Admin IRMA MAN 3 Bogor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
    * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR */
    .sidebar { width: 260px; background-color: #0b3c29; color: white; display: flex; flex-direction: column; padding: 20px 0; box-shadow: 4px 0 10px rgba(0,0,0,0.05); flex-shrink: 0; }
    .sidebar-logo { text-align: center; padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-logo img { width: 50px; height: 50px; object-fit: contain; }
    .sidebar-logo h3 { margin: 10px 0 2px; font-size: 16px; color: #ffb703; }
    .sidebar-logo p { margin: 0; font-size: 11px; color: #adb5bd; }
    .menu-list { list-style: none; padding: 0; margin: 20px 0; overflow-y: auto; flex-grow: 1; }
    .menu-item a { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #adb5bd; text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.2s; }
    .menu-item.active a, .menu-item a:hover { background-color: rgba(255,255,255,0.1); color: white; border-left: 4px solid #ffb703; }

    /* MAIN CONTENT */
    .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; width: 100%; }
    .topbar { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); gap: 10px; flex-wrap: wrap; }
    .topbar-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    .topbar h2 { margin: 0; color: #0b3c29; font-size: 18px; }
    
    .btn-kembali { background: #6c757d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; border: none; cursor: pointer; }
    .btn-kembali:hover { background: #5a6268; }
    .btn-keluar { background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }

    .content-body { padding: 30px; max-width: 900px; width: 100%; margin: 0 auto; }
    .btn-tambah-berita { background: #2a9d8f; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn-tambah-berita:hover { background: #21867a; }

    /* MODAL */
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { color: #0b3c29; margin-top: 0; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #555; }
    .form-group input[type="text"], .form-group input[type="file"], .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    .foto-preview-box { margin-top: 10px; display: none; }
    .foto-preview-box img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .btn-hapus-foto { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; margin-top: 6px; }

    /* Dokumen lampiran */
    .dok-info-box { display: none; margin-top: 10px; background: #eef7f4; border: 1px solid #cfe6de; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #0b3c29; align-items: center; justify-content: space-between; gap: 10px; }
    .dok-info-box .dok-nama { font-weight: 700; word-break: break-all; }
    .help-text { font-size: 11px; color: #888; margin-top: 4px; display: block; }

    .btn-submit { background: #0b3c29; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; }
    .btn-submit:disabled { background: #7f8c8d; cursor: not-allowed; }
    .btn-batal { background: #7f8c8d; color: white; border: none; padding: 8px; border-radius: 8px; width: 100%; margin-top: 5px; cursor: pointer; font-weight: 600; }

    /* KARTU BERITA */
    .news-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .news-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #0b3c29; }
    .news-foto { width: 100%; max-height: 360px; object-fit: cover; display: block; background: #f0f0f0; }
    .news-header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .news-title { margin: 0; color: #0b3c29; font-size: 18px; font-weight: 700; }
    .news-date { font-size: 11px; color: #777; background: #e9ecef; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
    .news-content { padding: 0 20px 15px; color: #444; font-size: 14px; line-height: 1.6; white-space: pre-line; word-break: break-word; }
    .news-dok { margin: 0 20px 18px; display: inline-flex; align-items: center; gap: 8px; background: #fff8e1; border: 1px solid #f1d98a; color: #0b3c29; text-decoration: none; padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; word-break: break-all; }
    .news-dok:hover { background: #ffefb8; }
    .news-footer { padding: 10px 20px; background: #f8f9fa; border-top: 1px solid #eee; font-size: 12px; color: #666; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .action-buttons { display: flex; gap: 8px; }
    .btn-edit { background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
    .btn-edit:hover { background: #d68910; }
    .btn-hapus { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
    .btn-hapus:hover { background: #c0392b; }

    @media (max-width: 768px) {
      body { flex-direction: column; height: auto; overflow: auto; }
      .sidebar { width: 100%; padding: 12px 15px; }
      .sidebar-logo { display: flex; align-items: center; gap: 12px; text-align: left; padding: 0 0 10px; }
      .sidebar-logo img { width: 38px; height: 38px; }
      .sidebar-logo h3 { margin: 0; font-size: 14px; }
      .menu-list { margin: 8px 0 0; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
      .menu-item a { padding: 8px 12px; border-radius: 6px; white-space: nowrap; border-left: none !important; background: rgba(255,255,255,0.08); }
      .menu-item.active a { background: #ffb703; color: #0b3c29; }
      .topbar { padding: 12px 16px; }
      .topbar h2 { font-size: 15px; }
      .content-body { padding: 16px; }
      .news-header { flex-direction: column; align-items: flex-start; }
      .news-title { font-size: 16px; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Foto
    let fotoLamaUrl = "";
    let hapusFotoFlag = false;

    // Dokumen lampiran
    let dokLamaUrl = "";
    let dokLamaNama = "";
    let hapusDokFlag = false;
    const MAKS_DOK_MB = 10;
    const EKSTENSI_DOK = ["pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx"];

    // Cegah karakter HTML dari data masuk ke tampilan
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    window.addEventListener("DOMContentLoaded", () => { muatBerita(); });

    // ================= FOTO =================
    function tampilkanPreview(src) {
      const box = document.getElementById("fotoPreviewBox");
      const img = document.getElementById("fotoPreviewImg");
      if (src) {
        img.src = src;
        box.style.display = "block";
      } else {
        img.src = "";
        box.style.display = "none";
      }
    }

    window.handleFileChange = function(event) {
      const file = event.target.files[0];
      if (!file) {
        tampilkanPreview(hapusFotoFlag ? "" : fotoLamaUrl);
        return;
      }
      if (!file.type.startsWith("image/")) {
        alert("⚠️ Harap pilih file gambar (JPG, PNG, WEBP).");
        event.target.value = "";
        return;
      }
      if (file.size > 3 * 1024 * 1024) {
        alert("⚠️ Ukuran foto maksimal 3 MB.");
        event.target.value = "";
        return;
      }
      hapusFotoFlag = false;
      const reader = new FileReader();
      reader.onload = (e) => tampilkanPreview(e.target.result);
      reader.readAsDataURL(file);
    };

    window.hapusFotoTerpilih = function() {
      document.getElementById("inputFoto").value = "";
      fotoLamaUrl = "";
      hapusFotoFlag = true;
      tampilkanPreview("");
    };

    // ================= DOKUMEN =================
    function tampilkanDok(nama) {
      const box = document.getElementById("dokInfoBox");
      const label = document.getElementById("dokNamaLabel");
      if (nama) {
        label.textContent = nama;
        box.style.display = "flex";
      } else {
        label.textContent = "";
        box.style.display = "none";
      }
    }

    window.handleDokChange = function(event) {
      const file = event.target.files[0];
      if (!file) {
        tampilkanDok(hapusDokFlag ? "" : dokLamaNama);
        return;
      }
      const ext = file.name.split(".").pop().toLowerCase();
      if (!EKSTENSI_DOK.includes(ext)) {
        alert("⚠️ Format dokumen harus: " + EKSTENSI_DOK.join(", ").toUpperCase() + ".");
        event.target.value = "";
        return;
      }
      if (file.size > MAKS_DOK_MB * 1024 * 1024) {
        alert("⚠️ Ukuran dokumen maksimal " + MAKS_DOK_MB + " MB.");
        event.target.value = "";
        return;
      }
      hapusDokFlag = false;
      tampilkanDok("📄 " + file.name + " (siap diunggah)");
    };

    window.hapusDokTerpilih = function() {
      document.getElementById("inputDokumen").value = "";
      dokLamaUrl = "";
      dokLamaNama = "";
      hapusDokFlag = true;
      tampilkanDok("");
    };

    // ================= MODAL TAMBAH =================
    window.bukaModalBerita = () => { 
      document.getElementById("formBerita").reset();
      document.getElementById("modalTitle").innerText = "Tambah Berita Baru";
      document.getElementById("editDocId").value = "";
      fotoLamaUrl = "";
      hapusFotoFlag = false;
      tampilkanPreview("");
      dokLamaUrl = "";
      dokLamaNama = "";
      hapusDokFlag = false;
      tampilkanDok("");
      document.getElementById("modalBerita").style.display = "flex"; 
    };
    
    window.tutupModalBerita = () => {
      document.getElementById("modalBerita").style.display = "none";
    };

    async function uploadKeStorage(file, folder) {
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const filePath = `${folder}/${Date.now()}_${safeName}`;
      const storageRef = ref(storage, filePath);
      await uploadBytes(storageRef, file);
      return await getDownloadURL(storageRef);
    }

    // ================= SIMPAN (TAMBAH / EDIT) =================
    window.simpanBerita = async function(e) {
      e.preventDefault();
      const btnSubmit = document.getElementById("btnSubmitBerita");
      const docId = document.getElementById("editDocId").value;
      const judul = document.getElementById("inputJudul").value.trim();
      const isi = document.getElementById("inputIsi").value.trim();
      const penulis = document.getElementById("inputPenulis").value.trim() || "Pengurus / Pembina IRMA";
      const fileFoto = document.getElementById("inputFoto").files[0];
      const fileDok = document.getElementById("inputDokumen").files[0];

      btnSubmit.disabled = true;
      btnSubmit.innerText = (fileFoto || fileDok) ? "⏳ Mengupload file & menyimpan..." : "⏳ Menyimpan...";

      try {
        // Foto
        let finalFotoUrl = hapusFotoFlag ? "" : fotoLamaUrl;
        if (fileFoto) {
          finalFotoUrl = await uploadKeStorage(fileFoto, "informasi_irma");
        }

        // Dokumen
        let finalDokUrl = hapusDokFlag ? "" : dokLamaUrl;
        let finalDokNama = hapusDokFlag ? "" : dokLamaNama;
        if (fileDok) {
          finalDokUrl = await uploadKeStorage(fileDok, "dokumen_irma");
          finalDokNama = fileDok.name;
        }

        if (docId) {
          await updateDoc(doc(db, "informasi_irma", docId), {
            judul,
            isi,
            penulis,
            fotoUrl: finalFotoUrl,
            dokumenUrl: finalDokUrl,
            dokumenNama: finalDokNama
          });
          alert("✅ Berita berhasil diperbarui!");
        } else {
          await addDoc(collection(db, "informasi_irma"), {
            judul,
            isi,
            penulis,
            fotoUrl: finalFotoUrl,
            dokumenUrl: finalDokUrl,
            dokumenNama: finalDokNama,
            waktu: serverTimestamp(),
            tanggal: new Date().toLocaleDateString("id-ID", { day: 'numeric', month: 'long', year: 'numeric' })
          });
          alert("✅ Berita berhasil diposting!");
        }
        tutupModalBerita();
        muatBerita();
      } catch (err) {
        alert("❌ Gagal: " + err.message);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "💾 Simpan";
      }
    };

    // ================= BUKA MODAL EDIT =================
    window.editBerita = async function(id) {
      try {
        const docRef = doc(db, "informasi_irma", id);
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById("formBerita").reset();
          document.getElementById("editDocId").value = id;
          document.getElementById("inputJudul").value = data.judul || "";
          document.getElementById("inputPenulis").value = data.penulis || "Pembina / Pengurus IRMA";
          document.getElementById("inputIsi").value = data.isi || "";
          
          fotoLamaUrl = data.fotoUrl || "";
          hapusFotoFlag = false;
          tampilkanPreview(fotoLamaUrl);

          dokLamaUrl = data.dokumenUrl || "";
          dokLamaNama = data.dokumenNama || "";
          hapusDokFlag = false;
          tampilkanDok(dokLamaUrl ? "📄 " + (dokLamaNama || "Dokumen terlampir") : "");

          document.getElementById("modalTitle").innerText = "Edit Berita";
          document.getElementById("modalBerita").style.display = "flex";
        } else {
          alert("Data berita tidak ditemukan.");
        }
      } catch (err) {
        alert("❌ Gagal mengambil data: " + err.message);
      }
    };

    // ================= MUAT DAFTAR BERITA =================
    async function muatBerita() {
      const container = document.getElementById("daftarInformasi");
      container.innerHTML = `<p style="text-align:center; color:#777;">Memuat...</p>`;
      try {
        const q = query(collection(db, "informasi_irma"), orderBy("waktu", "desc"));
        const snap = await getDocs(q);
        if (snap.empty) {
          container.innerHTML = `<div style="background:white; padding:30px; text-align:center; border-radius:12px;">Belum ada berita.</div>`;
          return;
        }
        let html = "";
        snap.forEach((d) => {
          const item = d.data();
          const fotoHtml = item.fotoUrl
            ? `<img src="${esc(item.fotoUrl)}" alt="${esc(item.judul)}" class="news-foto" loading="lazy" />`
            : "";
          const dokHtml = item.dokumenUrl
            ? `<a class="news-dok" href="${esc(item.dokumenUrl)}" target="_blank" rel="noopener noreferrer">📎 Unduh Dokumen: ${esc(item.dokumenNama || "Lampiran")}</a>`
            : "";
          html += `
            <div class="news-card">
              ${fotoHtml}
              <div class="news-header">
                <h3 class="news-title">${esc(item.judul)}</h3>
                <span class="news-date">📅 ${esc(item.tanggal)}</span>
              </div>
              <div class="news-content">${esc(item.isi)}</div>
              ${dokHtml}
              <div class="news-footer">
                <span>👤 Oleh: <strong>${esc(item.penulis)}</strong></span>
                <div class="action-buttons">
                  <button class="btn-edit" onclick="editBerita('${d.id}')">✏️ Edit</button>
                  <button class="btn-hapus" onclick="hapusPosting('${d.id}')">🗑️ Hapus</button>
                </div>
              </div>
            </div>`;
        });
        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p style="color:red;">Gagal memuat.</p>`;
      }
    }

    // ================= HAPUS BERITA =================
    window.hapusPosting = async function(id) {
      if (!confirm("⚠️ Yakin hapus berita ini?")) return;
      try {
        await deleteDoc(doc(db, "informasi_irma", id));
        muatBerita();
      } catch (err) {
        alert("❌ Gagal: " + err.message);
      }
    };
  </script>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Logo">
      <h3>PORTAL IRMA</h3>
      <p>MAN 3 BOGOR</p>
    </div>
    <ul class="menu-list">
      <li class="menu-item active"><a href="admin-informasi.html">📢 Kelola Informasi</a></li>
    </ul>
  </div>

  <!-- KONTEN UTAMA -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <a href="beranda.html" class="btn-kembali">← Kembali ke Beranda</a>
        <h2>📢 Panel Kelola Informasi (Admin)</h2>
      </div>
      <button onclick="localStorage.clear(); window.location.href='index.html';" class="btn-keluar">Keluar</button>
    </div>

    <div class="content-body">
      <button class="btn-tambah-berita" onclick="bukaModalBerita()">+ Buat Informasi Baru</button>
      <div id="daftarInformasi" class="news-grid"></div>
    </div>
  </div>

  <!-- MODAL POPUP FORM (TAMBAH & EDIT) -->
  <div id="modalBerita" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Tambah Berita Baru</h3>
      <form id="formBerita" onsubmit="simpanBerita(event)">
        <input type="hidden" id="editDocId" value="" />
        
        <div class="form-group">
          <label>Judul</label>
          <input type="text" id="inputJudul" required />
        </div>
        <div class="form-group">
          <label>Penulis</label>
          <input type="text" id="inputPenulis" value="Pembina / Pengurus IRMA" required />
        </div>
        <div class="form-group">
          <label>Foto Pendukung (Opsional, maks. 3 MB)</label>
          <input type="file" id="inputFoto" accept="image/*" onchange="handleFileChange(event)" />
          <div id="fotoPreviewBox" class="foto-preview-box">
            <img id="fotoPreviewImg" src="" alt="Preview Foto" />
            <button type="button" class="btn-hapus-foto" onclick="hapusFotoTerpilih()">🗑️ Hapus Foto</button>
          </div>
        </div>
        <div class="form-group">
          <label>Isi Berita</label>
          <textarea id="inputIsi" rows="6" required></textarea>
        </div>

        <div class="form-group">
          <label>📎 Dokumen Lampiran (Opsional, maks. 10 MB)</label>
          <input type="file" id="inputDokumen" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" onchange="handleDokChange(event)" />
          <span class="help-text">Format: PDF, Word, Excel, PowerPoint. Anggota/siswa bisa mengunduhnya.</span>
          <div id="dokInfoBox" class="dok-info-box">
            <span class="dok-nama" id="dokNamaLabel"></span>
            <button type="button" class="btn-hapus-foto" style="margin-top:0; flex-shrink:0;" onclick="hapusDokTerpilih()">🗑️ Hapus</button>
          </div>
        </div>

        <button type="submit" id="btnSubmitBerita" class="btn-submit">💾 Simpan</button>
        <button type="button" class="btn-batal" onclick="tutupModalBerita()">Batal</button>
      </form>
    </div>
  </div>

</body>
</html>
