<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entri Biodata - Portal IRMA</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: transparent; padding: 0; margin: 0; color: #333; }
    .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { color: #0a3622; margin-top: 0; border-bottom: 2px solid #d4af37; padding-bottom: 10px; display: inline-block; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    label { font-size: 13px; font-weight: bold; color: #0a3622; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
    .btn-simpan { background: #0a3622; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
    .btn-simpan:hover { background: #1a5c3a; }
    .btn-simpan:disabled { background: #888; cursor: not-allowed; }
    .preview-img { max-width: 100px; max-height: 100px; margin-top: 10px; border-radius: 6px; object-fit: cover; display: none; border: 2px solid #0a3622; }
  </style>

  <!-- SCRIPT FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fb = { doc, setDoc };
  </script>
</head>
<body>

  <div class="card">
    <h2>📝 Entri Biodata Siswa</h2>
    
    <form id="formBiodata" onsubmit="simpanBiodata(event)">
      
      <div class="form-group">
        <label>Foto Profil (Maks 300KB)</label>
        <input type="file" id="inFoto" accept="image/*" onchange="previewFoto(event)">
        <img id="imgPreview" class="preview-img" alt="Preview Foto">
      </div>

      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="inNama" placeholder="Masukkan nama lengkap" required>
      </div>

      <div class="form-group">
        <label>NIS</label>
        <input type="text" id="inNis" placeholder="Masukkan NIS" required>
      </div>

      <div class="form-group">
        <label>Kelas</label>
        <input type="text" id="inKelas" placeholder="Contoh: 10">
      </div>

      <div class="form-group">
        <label>Jurusan</label>
        <input type="text" id="inJurusan" placeholder="Contoh: IPS">
      </div>

      <div class="form-group">
        <label>Tempat Lahir</label>
        <input type="text" id="inTempatLahir" placeholder="Contoh: BOGOR">
      </div>

      <div class="form-group">
        <label>Tanggal Lahir</label>
        <input type="date" id="inTanggalLahir">
      </div>

      <div class="form-group">
        <label>No HP</label>
        <input type="tel" id="inNoHp" placeholder="Contoh: 08123456789">
      </div>

      <div class="form-group">
        <label>Alamat</label>
        <textarea id="inAlamat" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
      </div>

      <button type="submit" class="btn-simpan" id="btnSimpan">Simpan Biodata</button>
    </form>
  </div>

  <script>
    let base64Foto = ""; 

    function previewFoto(event) {
      const file = event.target.files[0];
      if (file) {
        // Batasi maksimal 300KB agar aman dari error 400 Firestore
        if (file.size > 300 * 1024) {
          alert("Ukuran foto terlalu besar! Maksimal 300KB agar muat di database.");
          event.target.value = ""; 
          document.getElementById("imgPreview").style.display = "none";
          base64Foto = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById("imgPreview");
          img.src = e.target.result;
          img.style.display = "block";
          base64Foto = e.target.result; 
        };
        reader.readAsDataURL(file);
      }
    }

    window.simpanBiodata = async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSimpan");
      
      btn.textContent = "⏳ Menyimpan data...";
      btn.disabled = true;

      try {
        // Ambil ID User dari localStorage yang dikirim saat login
        const userId = localStorage.getItem("irmaUserId");
        
        if (!userId) {
          alert("❌ Sesi login tidak ditemukan. Silakan login ulang.");
          window.location.href = "index.html";
          return;
        }

        const dataBiodata = {
          nama: document.getElementById("inNama").value,
          nis: document.getElementById("inNis").value,
          kelas: document.getElementById("inKelas").value,
          jurusan: document.getElementById("inJurusan").value,
          tempatLahir: document.getElementById("inTempatLahir").value,
          tanggalLahir: document.getElementById("inTanggalLahir").value,
          noHp: document.getElementById("inNoHp").value,
          alamat: document.getElementById("inAlamat").value,
          fotoUrl: base64Foto, 
          updatedAt: new Date().toISOString()
        };

        // Simpan menggunakan setDoc berdasarkan UID user agar terikat langsung
        const { doc, setDoc } = window.fb;
        await setDoc(doc(window.db, "biodata_siswa", userId), dataBiodata, { merge: true });

        alert("✅ Biodata berhasil disimpan!");

      } catch (error) {
        console.error(error);
        alert("❌ Gagal menyimpan data: " + error.message);
      } finally {
        btn.textContent = "Simpan Biodata";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
