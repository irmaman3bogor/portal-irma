<script>
    let base64Foto = ""; // Variabel untuk menyimpan data foto

    // Fungsi untuk mengatur tampilan form berdasarkan pilihan jabatan
    window.aturForm = function() {
      const jabatan = document.getElementById("inJabatan").value;
      const containerSiswa = document.getElementById("formSiswaContainer");
      
      const nisInput = document.getElementById("inNis");
      const kelasInput = document.getElementById("inKelas");
      const jurusanInput = document.getElementById("inJurusan");

      if (jabatan === "Kepala Madrasah" || jabatan === "Pembina" || jabatan === "Pelatih") {
        containerSiswa.classList.add("hidden"); // Sembunyikan field siswa
        // Hapus 'required' agar form tidak error saat disimpan
        nisInput.removeAttribute("required");
        kelasInput.removeAttribute("required");
        jurusanInput.removeAttribute("required");
      } else {
        containerSiswa.classList.remove("hidden"); // Tampilkan field siswa
        // Tambahkan kembali 'required'
        nisInput.setAttribute("required", "true");
        kelasInput.setAttribute("required", "true");
        jurusanInput.setAttribute("required", "true");
      }
    }

    // Fungsi untuk pratinjau foto
    function previewFoto(event) {
      const file = event.target.files[0];
      if (file) {
        if (file.size > 300 * 1024) { // Batas 300KB
          alert("Ukuran foto terlalu besar! Maksimal 300KB.");
          event.target.value = ""; 
          document.getElementById("imgPreview").style.display = "none";
          base64Foto = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById("imgPreview");
          img.src = e.target.result;
          img.style.display = "block";
          base64Foto = e.target.result; // Simpan Base64 foto
        };
        reader.readAsDataURL(file);
      }
    }

    // --- FITUR BARU: AMBIL DAN TAMPILKAN DATA SAAT HALAMAN DIMUAT ---
    // Gunakan event 'DOMContentLoaded' agar kode berjalan saat HTML selesai dimuat
    document.addEventListener("DOMContentLoaded", async () => {
        // 1. Ambil SDK Firestore yang diperlukan
        // (Bapak tidak perlu mengimpor ulang initializeApp, cukup db dan fb yang sudah ada)
        const { getDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js");
        const userId = localStorage.getItem("irmaUserId");

        if (!userId) {
          alert("❌ Sesi login tidak ditemukan. Silakan login ulang.");
          window.location.href = "index.html"; // Redirect jika tidak ada sesi
          return;
        }

        try {
          // 2. Ambil dokumen dari Firestore
          const docRef = doc(window.db, "biodata_siswa", userId);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();

            // 3. Isi Formulir dengan data yang ada
            document.getElementById("inJabatan").value = data.jabatan || "";
            document.getElementById("inNama").value = data.nama || "";
            document.getElementById("inTempatLahir").value = data.tempatLahir || "";
            document.getElementById("inTanggalLahir").value = data.tanggalLahir || "";
            document.getElementById("inNoHp").value = data.noHp || "";
            document.getElementById("inAlamat").value = data.alamat || "";

            // ⚠️ SOLUSI KUNCI 1: Pulihkan State Dropdown Dinamis ⚠️
            // Jalankan fungsi aturForm() secara manual setelah mengisi field jabatan
            window.aturForm();

            // 4. Isi field siswa hanya jika jabatannya adalah siswa
            if (data.nis) document.getElementById("inNis").value = data.nis;
            if (data.kelas) document.getElementById("inKelas").value = data.kelas;
            if (data.jurusan) document.getElementById("inJurusan").value = data.jurusan;
            if (data.namaOrtu) document.getElementById("inNamaOrtu").value = data.namaOrtu;
            if (data.hpOrtu) document.getElementById("inHpOrtu").value = data.hpOrtu;

            // ⚠️ SOLUSI KUNCI 2: Pulihkan Pratinjau Foto ⚠️
            if (data.fotoUrl) {
              base64Foto = data.fotoUrl; // Simpan kembali ke variabel global
              const imgPreview = document.getElementById("imgPreview");
              imgPreview.src = data.fotoUrl;
              imgPreview.style.display = "block";
            }
          } else {
            // Data tidak ditemukan di Firestore, formulir tetap kosong
            console.log("No such document!");
          }
        } catch (error) {
          console.error("Error getting document:", error);
          alert("❌ Gagal mengambil data: " + error.message);
        }
    });

    // --- FUNGSI SIMPAN DATA (Dipertahankan dari sebelumnya) ---
    window.simpanData = async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSimpan");
      
      btn.textContent = "⏳ Menyimpan data...";
      btn.disabled = true;

      try {
        const userId = localStorage.getItem("irmaUserId");
        
        if (!userId) {
          alert("❌ Sesi login tidak ditemukan. Silakan login ulang.");
          window.location.href = "index.html";
          return;
        }

        const jabatan = document.getElementById("inJabatan").value;
        const isPengurus = (jabatan === "Kepala Madrasah" || jabatan === "Pembina" || jabatan === "Pelatih");

        const dataEntri = {
          nama: document.getElementById("inNama").value,
          jabatan: jabatan,
          tempatLahir: document.getElementById("inTempatLahir").value,
          tanggalLahir: document.getElementById("inTanggalLahir").value,
          noHp: document.getElementById("inNoHp").value,
          alamat: document.getElementById("inAlamat").value,
          fotoUrl: base64Foto, // Gunakan variabel base64Foto yang sudah ada
          updatedAt: new Date().toISOString()
        };

        if (!isPengurus) {
          dataEntri.nis = document.getElementById("inNis").value;
          dataEntri.kelas = document.getElementById("inKelas").value;
          dataEntri.jurusan = document.getElementById("inJurusan").value;
          dataEntri.namaOrtu = document.getElementById("inNamaOrtu").value;
          dataEntri.hpOrtu = document.getElementById("inHpOrtu").value;
        } else {
          // Kosongkan field siswa
          dataEntri.nis = "";
          dataEntri.kelas = "";
          dataEntri.jurusan = "";
          dataEntri.namaOrtu = "";
          dataEntri.hpOrtu = "";
        }

        const { doc, setDoc } = window.fb;
        await setDoc(doc(window.db, "biodata_siswa", userId), dataEntri, { merge: true });

        alert("✅ Data berhasil disimpan!");

      } catch (error) {
        console.error(error);
        alert("❌ Gagal menyimpan data: " + error.message);
      } finally {
        btn.textContent = "Simpan Data";
        btn.disabled = false;
      }
    }
  </script>
